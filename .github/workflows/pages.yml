# Publishes web/ with GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Over https, phones may use the live camera in the app.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The version published: pages older than it offer to load it (web/app/version.js)
      - name: Stamp the version
        run: |
          v="${GITHUB_SHA::12}"
          printf '{"version": "%s"}\n' "$v" > web/version.json
          sed -i "s|<meta name=\"arail-version\" content=\"dev\">|<meta name=\"arail-version\" content=\"$v\">|" web/app/index.html web/game/index.html
          for f in web/app/index.html web/game/index.html; do
            grep -q "<meta name=\"arail-version\" content=\"$v\">" "$f" || { echo "$f: no meta arail-version stamped"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
