name: Feature request
description: Suggest a new object type, simulation, disruption or other improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the situation in your lab or course, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: contribute
    attributes:
      label: Could you help build it?
      options:
        - "Yes, I could open a pull request"
        - "Yes, with some guidance"
        - "No"
