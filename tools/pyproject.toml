[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arail-tools"
version = "0.1.0"
description = "ARail-EBL tools: camera calibration, control-system bridge and synthetic test scenes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ARail-EBL contributors" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# OpenCV is needed for calibration and synthetic scenes, not for the bridge.
# Use "opencv" on desktops (with GUI windows) and "headless" on servers/CI.
opencv = ["opencv-python>=4.8"]
headless = ["opencv-python-headless>=4.8"]
bridge = ["aiohttp>=3.9"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arail-bridge = "arail_tools.bridge.__main__:main"
arail-calibrate = "arail_tools.calibrate:main"
arail-synthetic = "arail_tools.synthetic:main"

[project.urls]
Homepage = "https://joernmht.github.io/ARail-EBL/"
Source = "https://github.com/joernmht/ARail-EBL"

[tool.setuptools.packages.find]
include = ["arail_tools*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
