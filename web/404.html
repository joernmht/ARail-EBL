<style>
:root {
  --bg: #eef1f4; --ink: #16202b; --ink-2: #566374;
  --board: #0f1a2b; --board-2: #18263b; --board-ink: #e8eef8; --board-muted: #93a4bb; --amber: #f2a93b;
  --link: #1d4f9c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e131a; --ink: #e6ebf1; --ink-2: #9aa6b4; --board: #0a111d; --board-2: #142036; --link: #8fb3ef; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e131a; --ink: #e6ebf1; --ink-2: #9aa6b4; --board: #0a111d; --board-2: #142036; --link: #8fb3ef; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: min(100%, 560px); display: grid; gap: 18px; }
.board { background: var(--board); color: var(--board-ink); border-radius: 6px; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; }
.board header { background: var(--board-2); padding: 10px 16px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--board-muted); }
.board p { margin: 0; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: baseline; }
.board b { color: var(--amber); font-size: 1.6rem; }
.board span { font-size: 1.05rem; }
.board small { grid-column: 2; color: var(--board-muted); font-size: .85rem; }
h1 { margin: 0; font-size: 1.4rem; }
ul { margin: 0; padding-left: 20px; }
a { color: var(--link); font-weight: 600; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
</style>
