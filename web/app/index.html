<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A777F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#001450" media="(prefers-color-scheme: dark)">
<title>ARail App</title>
<meta name="description" content="Augmented reality for model railway labs: platforms with passengers, a town with streets and bus lines through day and night, rail operations with fleet maintenance and crews, journeys with transfers for exercises, disruptions, and a flyover with a virtual camera.">
<link rel="icon" href="../assets/favicon-app.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts/fonts-app.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="flyover.css">
<link rel="stylesheet" href="tour.css">
</head>
<body>
<div class="app">
  <header class="bar" id="bar">
    <h1 class="visually-hidden">ARail app</h1>
    <div class="identity">
      <img class="cro-logo" src="../assets/cro-logo-white.svg" width="1014" height="321" alt="TU Dresden, Chair of Railway Operations">
      <span class="divider" aria-hidden="true"></span>
      <a class="brand" href="../" title="About ARail-EBL"><span class="sign" translate="no">AR</span><span translate="no">ail</span> <small translate="no">EBL</small></a>
    </div>
    <span class="layout-name" id="layoutName"></span>
    <span class="spacer"></span>
    <button class="bar-clock" id="barClock" type="button" title="Time and speed (Settings → Simulation)"></button>
    <div class="sources" role="group" aria-label="Image source">
      <button class="btn primary" id="btnLive" type="button" hidden><span class="long">Live camera</span><span class="short">Camera</span></button>
      <label class="btn" for="filePhoto"><span class="long">Take photo</span><span class="short">Photo</span></label>
      <input class="visually-hidden" type="file" id="filePhoto" accept="image/*" capture="environment">
      <label class="btn" for="fileVideo"><span class="long">Record video</span><span class="short">Video</span></label>
      <input class="visually-hidden" type="file" id="fileVideo" accept="video/*" capture="environment">
      <label class="btn" for="fileOpen"><span class="long">Open file</span><span class="short">File</span></label>
      <input class="visually-hidden" type="file" id="fileOpen" accept="image/*,video/*">
    </div>
  </header>

  <div class="main">
    <main class="stage" id="stageWrap">
      <canvas id="stage" width="1280" height="720" role="img" aria-label="Camera image with augmented reality"></canvas>
      <div class="empty-stage" id="emptyStage" hidden></div>
      <div class="tour" id="tour" role="group" aria-label="Photo tour of the lab" hidden></div>
      <div class="hud" id="hud"></div>
      <div class="fly-nav" id="flyNav" role="group" aria-label="Flyover camera" hidden>
        <button class="btn" type="button" data-fly="zoom-in" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
        <button class="btn" type="button" data-fly="zoom-out" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
        <button class="btn" type="button" data-fly="rotate-left" aria-label="Rotate left" title="Rotate left (Q)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 7.5A6 6 0 1 1 4.6 13"/><path d="M4.5 3.5v4.4h4.4"/></svg></button>
        <button class="btn" type="button" data-fly="rotate-right" aria-label="Rotate right" title="Rotate right (E)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14.8 7.5A6 6 0 1 0 15.4 13"/><path d="M15.5 3.5v4.4h-4.4"/></svg></button>
        <button class="btn" type="button" data-fly="plan" aria-label="Plan view" aria-pressed="false" title="Plan view: look straight down (Page Up and Page Down tilt)"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" rx="1"/><path d="M3.5 10h13M10 3.5v13"/></svg></button>
        <button class="btn" type="button" data-fly="fit" aria-label="Show the whole layout" title="Show the whole layout (Home)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></svg></button>
      </div>
      <div class="stage-tools">
        <button class="btn" id="btnFlyover" type="button" aria-pressed="false" title="Look at and edit the layout with a virtual camera (F)">Flyover</button>
        <button class="btn" id="btnMap" type="button" data-simple="map" aria-pressed="false" title="Map: the whole layout from above, simple and fast (Shift+S)">Map</button>
        <button class="btn" id="btnSimple3d" type="button" data-simple="3d" aria-pressed="false" title="Simple 2.5D view: a flat layout, moving things as blocks (S)">2.5D</button>
        <button class="btn" id="btnFreeze" type="button" aria-pressed="false" title="Keep the current frame (for editing)">Freeze</button>
        <button class="btn" id="btnFullscreen" type="button" title="Full screen">Full screen</button>
      </div>
      <div class="placing" id="placing" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </main>

    <aside class="panel" id="panel">
      <nav class="tabs" role="tablist" aria-label="Panels">
        <button role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" title="The state of assets and people">Overview</button>
        <button role="tab" id="tab-interaction" aria-controls="panel-interaction" aria-selected="false" title="The modules and their cases, by side: infrastructure and railway undertaking">Interaction</button>
        <button role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false" title="View, simulation (time, speed, demand, stops) and the control system">Settings</button>
      </nav>
      <section class="tabpanel" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview"></section>
      <section class="tabpanel" role="tabpanel" id="panel-interaction" aria-labelledby="tab-interaction" hidden></section>
      <section class="tabpanel" role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden></section>
    </aside>
  </div>
</div>

<!-- Marker detection (js-aruco2, vendored; classic scripts defining AR and CV) -->
<script src="../vendor/js-aruco2/cv.js"></script>
<script src="../vendor/js-aruco2/aruco.js"></script>
<script src="../vendor/js-aruco2/dictionaries/aruco_4x4_1000.js"></script>
<script src="../vendor/js-aruco2/dictionaries/aruco_5x5_1000.js"></script>
<script src="../vendor/js-aruco2/dictionaries/aruco_6x6_1000.js"></script>
<script src="../vendor/js-aruco2/dictionaries/aruco_7x7_1000.js"></script>
<script src="../vendor/js-aruco2/dictionaries/apriltag_36h11.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
